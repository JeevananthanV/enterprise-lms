version: '3.8'

services:
  # Ingress Nginx Gateway / Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: lms_prod_gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - lms_prod_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Frontend SPA Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lms_prod_frontend
    restart: always
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lms_prod_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Backend FastAPI REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms_prod_backend
    restart: always
    expose:
      - "8000"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - lms_prod_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # PostgreSQL 16 Relational Engine (ACID Transactional Core)
  postgres:
    image: postgres:16-alpine
    container_name: lms_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms_db}
      POSTGRES_USER: ${POSTGRES_USER:-lms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_secure_pass_2026}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lms_user} -d $${POSTGRES_DB:-lms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms_prod_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # MongoDB 7 NoSQL Engine (Document Content Storage)
  mongodb:
    image: mongo:7.0
    container_name: lms_prod_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongo_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongo_secure_pass_2026}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-lms_content_db}
    volumes:
      - mongo_prod_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms_prod_network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # Redis 7 In-Memory Cache & Distributed Session Store
  redis:
    image: redis:7-alpine
    container_name: lms_prod_redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secure_pass_2026}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms_prod_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

networks:
  lms_prod_network:
    name: lms_production_network
    driver: bridge

volumes:
  postgres_prod_data:
  mongo_prod_data:
  redis_prod_data:
  nginx_logs:
