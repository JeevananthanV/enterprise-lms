version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Presentation Tier - React + Vite + TypeScript Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lms_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lms_network

  # ----------------------------------------------------------------------------
  # Application / API Tier - FastAPI Modular Monolith Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/enterprise_lms
      - MONGODB_ENABLED=true
      - MONGODB_URL=mongodb://root:example@mongodb:27017
      - MONGODB_DB_NAME=enterprise_lms_content
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
      - JWT_SECRET=change-this-to-a-secure-random-secret-key-in-production-min-32-chars
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lms_network

  # ----------------------------------------------------------------------------
  # Data Tier - PostgreSQL 16 (Transactional Source of Truth)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: lms_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=enterprise_lms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_lms"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - lms_network

  # ----------------------------------------------------------------------------
  # Data Tier - MongoDB 7 (Rich Lesson & Assessment Content Store)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: lms_mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - lms_network

  # ----------------------------------------------------------------------------
  # Data Tier - Redis 7 (Caching, Token Denylist & Rate Limiting)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: lms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - lms_network

networks:
  lms_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
