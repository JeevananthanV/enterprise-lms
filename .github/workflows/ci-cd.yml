name: Enterprise LMS CI/CD Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality-and-test:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lms_test_db
          POSTGRES_USER: lms_test_user
          POSTGRES_PASSWORD: test_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx coverage

      - name: Run Pytest Suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_ci_cd_32_characters_long_min
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          MONGO_URI: mongodb://localhost:27017/lms_ci_test_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest backend/tests -v --tb=short

  frontend-quality-and-build:
    name: Frontend Lint, TypeCheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend TypeScript & Vite Production Build
        working-directory: ./frontend
        run: |
          npm run build

  docker-build-verification:
    name: Docker Multi-Stage Image Build Verification
    runs-on: ubuntu-latest
    needs: [backend-quality-and-test, frontend-quality-and-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f docker-compose.prod.yml config

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: enterprise-lms/backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: enterprise-lms/frontend:latest
